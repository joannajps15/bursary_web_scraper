# forward http requests to https
server {
    listen 80;
    server_name uwaterloobursary.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name uwaterloobursary.app;
    
    ssl_certificate /etc/letsencrypt/live/uwaterloobursary.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uwaterloobursary.app/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # outbound, display default index.html
    location / { 
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # inbound, forward api calls to flask
    location /bursary/ {
        # set header values
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # point to guincorn address
        proxy_pass http://flask:5000/;

        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # websocket
    location /socket.io {
        proxy_pass http://flask:5000/socket.io;
        proxy_http_version 1.1;       
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }
}