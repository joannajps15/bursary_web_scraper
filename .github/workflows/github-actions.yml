name: UWaterloo Bursary Web Scraper - GitHub Actions Workflow
on:
  push:
    branches:
      - 'main'
jobs:
  deploy:
    name: clone and restart docker containers 
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/bursary_web_scraper
            git pull origin main
            docker compose down
            docker compose up -d --build
      - run: echo "Successful deployment to EC2 instance 🎉"